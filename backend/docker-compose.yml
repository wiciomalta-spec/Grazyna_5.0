services:
  prometheus:
    image: prom/prometheus:latest
    container_name: grazyna-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - grazyna-net

  grafana:
    image: grafana/grafana:latest
    container_name: grazyna-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - grazyna-net

networks:
  grazyna-net:
    driver: bridge

volumes:
  grafana_data:
