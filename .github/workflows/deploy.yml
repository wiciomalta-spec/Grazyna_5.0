name: Grazyna 5.0 MAX HYBRYDA Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: grazyna-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Copy files to server
      run: |
        rsync -avz --delete ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/grazyna/

    - name: Canary deploy
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash /srv/grazyna/deploy/scripts/canary.sh"

    - name: Smoke test backend
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -fsS http://localhost:3001/health"

    - name: Smoke test frontend
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -fsS http://localhost:5173/"

    - name: Blue-Green switch
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash /srv/grazyna/deploy/scripts/blue_green.sh"

    - name: Full deploy
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "docker compose down --remove-orphans && docker compose up -d --build"

    - name: Notify INTELLI-OPS Dashboard
      env:
        INTELLI_OPS_URL: ${{ secrets.INTELLI_OPS_URL }}
      run: |
        curl -X POST "$INTELLI_OPS_URL/ops/feedback/rollout" \
        -H "Content-Type: application/json" \
        -d '{"latency_p99":110,"error_rate":0.001,"rollback":false,"reward":0.92}'

  rollback:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:
    - name: Rollback to previous version
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash /srv/grazyna/deploy/scripts/rollback.sh"

    - name: Notify INTELLI-OPS Dashboard (rollback)
      env:
        INTELLI_OPS_URL: ${{ secrets.INTELLI_OPS_URL }}
      run: |
        curl -X POST "$INTELLI_OPS_URL/ops/feedback/rollout" \
        -H "Content-Type: application/json" \
        -d '{"rollback":true,"reward":-1}'
