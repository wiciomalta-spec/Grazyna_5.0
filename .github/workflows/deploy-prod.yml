name: deploy-to-k8s

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type checking
        working-directory: ./frontend
        run: npm run type-check

      - name: Lint (opcjonalnie)
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Test (opcjonalnie)
        working-directory: ./frontend
        run: npm test || true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster
        run: |
          kubectl version --short
          kubectl get nodes
          kubectl get ns

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Check rollout
        run: |
          kubectl get deploy -A
          kubectl get pods -A
