apiVersion: apps/v1
kind: Deployment
metadata:
  name: grazyna-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grazyna
  template:
    metadata:
      labels:
        app: grazyna
    spec:
      containers:
      - name: backend
        image: grazyna-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: CHAOS
          value: "false"

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
